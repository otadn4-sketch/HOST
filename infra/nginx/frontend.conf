server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }
    location = /index.html {
        add_header Cache-Control "no-store";
        try_files /index.html =404;
    }
    location / { try_files $uri $uri/ /index.html; }
}
