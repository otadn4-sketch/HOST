# Local ClamAV — no cloud, no telemetry
Foreground yes
User clamav
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0
MaxThreads 4
MaxDirectoryRecursion 15
StreamMaxLength 100M
MaxScanSize 150M
MaxFileSize 100M
MaxFiles 10000
ScanPE yes
ScanELF yes
ScanOLE2 yes
ScanPDF yes
ScanSWF no
ScanXMLDOCS yes
ScanHWP3 no
AlertBrokenExecutables yes
DisableCertCheck yes
DatabaseDirectory /var/lib/clamav
LogTime yes
LogClean no
LogSyslog no
ExitOnOOM yes
